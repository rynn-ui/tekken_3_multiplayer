# ==============================================================================
# Tekken 3 Android - Netplay Test Configuration: HOST (Relay / MITM Traversal)
# Package: com.androidapks.tekken3
# ==============================================================================

libretro_directory = "/data/data/com.androidapks.tekken3/cores/"
input_overlay = "/data/data/com.androidapks.tekken3/overlays/gamepads/neo-retropad/neo-retropad.cfg"
input_overlay_enable = "true"
input_overlay_opacity = "0.750000"
input_overlay_scale = "1.000000"

# Netplay Host via Relay
netplay_enable = "true"
netplay_mode = "true"
netplay_ip_address = ""
netplay_ip_port = "55435"
netplay_nickname = "Host_Player1"

# Relay Configuration
netplay_use_mitm_server = "true"
netplay_mitm_server = "nyc"
netplay_nat_traversal = "true"
netplay_public_announce = "false"

# Latency Tuning (higher for internet/relay route: 4-5 frames = ~66-83ms)
netplay_input_latency_frames_min = "5"
netplay_input_latency_frames_range = "0"
netplay_stateless_mode = "false"
netplay_check_frames = "600"
netplay_allow_slaves = "true"
netplay_request_device_p1 = "1"
