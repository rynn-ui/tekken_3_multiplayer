# ==============================================================================
# Tekken 3 Android - Netplay Test Configuration: CLIENT (Local LAN / Wi-Fi)
# Package: com.androidapks.tekken3
# ==============================================================================

# Directory & Overlay Configuration
libretro_directory = "/data/data/com.androidapks.tekken3/cores/"
input_overlay = "/data/data/com.androidapks.tekken3/overlays/gamepads/neo-retropad/neo-retropad.cfg"
input_overlay_enable = "true"
input_overlay_opacity = "0.750000"
input_overlay_scale = "1.000000"

# Netplay Core Parameters
netplay_enable = "true"
netplay_mode = "false"
# IMPORTANT: Replace 192.168.1.100 with the actual local IP address of Host device
netplay_ip_address = "192.168.1.100"
netplay_ip_port = "55435"
netplay_nickname = "Client_Player2"

# Synchronization & Latency
# Must match host latency setting for consistent frame pacing
netplay_input_latency_frames_min = "3"
netplay_input_latency_frames_range = "0"
netplay_stateless_mode = "false"
netplay_check_frames = "600"

# Transport & Routing
netplay_use_mitm_server = "false"
netplay_nat_traversal = "false"
netplay_public_announce = "false"

# Player Assignment
netplay_request_device_p2 = "1"
